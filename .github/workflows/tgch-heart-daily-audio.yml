name: TGCH — Heart daily MP3 from verified original

on:
  schedule:
    - cron: '35 4 * * *'
      timezone: "America/Chicago"
    - cron: '35 5 * * *'
      timezone: "America/Chicago"
  # Archive backfill fires once when this approved workflow file changes.
  # Same workflow identity preserves the verified OIDC upload security checks.
  push:
    branches: [main]
    paths:
      - .github/workflows/tgch-heart-daily-audio.yml
  workflow_dispatch:
    inputs:
      devotional_date:
        description: 'Optional YYYY-MM-DD to record an earlier verified original'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tgch-heart-mp3
  cancel-in-progress: false

jobs:
  heart:
    if: github.event_name != 'push'
    name: Generate one verified Heart MP3
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check verified original and whether audio is already recorded
        id: ready
        env:
          TGCH_RUN_DATE: ${{ inputs.devotional_date }}
        run: |
          python - <<'PY'
          import datetime,hashlib,json,os,re
          from urllib.request import urlopen
          from urllib.error import HTTPError
          from zoneinfo import ZoneInfo
          date=os.environ.get("TGCH_RUN_DATE") or datetime.datetime.now(ZoneInfo("America/Chicago")).date().isoformat()
          if not re.fullmatch("[0-9]{4}-[0-9]{2}-[0-9]{2}",date): raise SystemExit("Invalid devotional date")
          base="https://qgxoombbfmimpbcollhi.supabase.co/functions/v1/"
          def get(path):
              with urlopen(base+path,timeout=45) as response: return json.load(response)
          record=False
          try: doc=get("tgch-devotionals?date="+date)
          except HTTPError as exc:
              if exc.code!=404: raise
              print("No approved original for",date,"— safely skipping")
          else:
              md=doc.get("markdown")
              sha=doc.get("sha256")
              if (doc.get("date")!=date or not isinstance(md,str) or
                  not isinstance(sha,str) or not re.fullmatch("[0-9a-f]{64}",sha) or
                  hashlib.sha256(md.encode("utf-8")).hexdigest()!=sha):
                  raise SystemExit("The original's full SHA-256 is invalid")
              state=get("tgch-heart-audio?date="+date)
              if state.get("available"):
                  if state.get("voice")!="af_heart" or state.get("source_sha256")!=sha:
                      raise SystemExit("Existing recording differs from the original")
                  print("Heart MP3 already source-verified for",date)
              else:
                  print("Heart MP3 needed for",date)
                  record=True
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("needs_audio="+str(record).lower()+"\n")
          PY
      - name: Install free Kokoro model dependencies
        if: steps.ready.outputs.needs_audio == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro==0.9.4' 'soundfile==0.13.1' 'numpy==1.26.4'
      - name: Read original, synthesize Heart, publish hash-verified MP3
        if: steps.ready.outputs.needs_audio == 'true'
        env:
          TGCH_RUN_DATE: ${{ inputs.devotional_date }}
        run: |
          if [ -n "$TGCH_RUN_DATE" ]; then
            python scripts/tgch_heart_daily_mp3.py --date "$TGCH_RUN_DATE"
          else
            python scripts/tgch_heart_daily_mp3.py
          fi

  backfill:
    name: Restore archived Heart reading for ${{ matrix.devotional_date }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        devotional_date:
          - '2026-11-01'
          - '2026-11-02'
          - '2026-11-03'
          - '2026-11-05'
          - '2026-11-06'
          - '2026-11-07'
          - '2026-11-09'
    steps:
      - name: Check out locked public Heart runner
        uses: actions/checkout@v4
      - name: Use Python 3.11 for verified Kokoro
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify this archival date still needs recording
        id: ready
        env:
          TGCH_ARCHIVE_DATE: ${{ matrix.devotional_date }}
        run: |
          python - <<'PY'
          import json,os,hashlib
          from urllib.request import urlopen
          date=os.environ['TGCH_ARCHIVE_DATE']
          base='https://qgxoombbfmimpbcollhi.supabase.co/functions/v1/'
          with urlopen(base+'tgch-devotionals?date='+date,timeout=50) as r:
              source=json.load(r)
          with urlopen(base+'tgch-heart-audio?date='+date,timeout=50) as r:
              audio=json.load(r)
          md=source.get('markdown')
          sha=source.get('sha256')
          if source.get('date')!=date or not isinstance(md,str) or not isinstance(sha,str) or len(sha)!=64 or hashlib.sha256(md.encode('utf-8')).hexdigest()!=sha:
              raise SystemExit('TGCH archival source integrity verification failed')
          needed=not audio.get('available',False)
          if not needed and (audio.get('source_sha256')!=sha or audio.get('voice')!='af_heart'):
              raise SystemExit('Existing audio conflicts with approved original; refusing replacement')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('needs_audio='+str(needed).lower()+'\n')
          print('TGCH',date,'needs archived Heart MP3:',needed)
          PY
      - name: Install approved Heart synthesis dependencies once for this date
        if: steps.ready.outputs.needs_audio == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro==0.9.4' 'soundfile==0.13.1' 'numpy==1.26.4'
      - name: Narrate, publish, and post-check exact original archive entry
        if: steps.ready.outputs.needs_audio == 'true'
        env:
          TGCH_ARCHIVE_DATE: ${{ matrix.devotional_date }}
        run: |
          python scripts/tgch_heart_daily_mp3.py --date "$TGCH_ARCHIVE_DATE"
